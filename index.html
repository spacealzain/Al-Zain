<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام مشفر | جاري التحديث</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050505;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* مؤثرات الخلفية المتحركة */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-glow 8s infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* دوران الحلقات حول القفل */
        .spin-slow {
            animation: spin 12s linear infinite;
        }
        .spin-slow-reverse {
            animation: spin 15s linear infinite reverse;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* التصميم الزجاجي */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        /* مؤشر الكتابة (Terminal Cursor) */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        /* شريط التقدم اللامع */
        .progress-glow {
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative bg-black selection:bg-emerald-500/30">

    <!-- مؤثرات الخلفية -->
    <div class="bg-glow"></div>
    <div class="absolute inset-0" style="background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 32px 32px; opacity: 0.5;"></div>

    <!-- الحاوية المركزية -->
    <div class="relative z-10 w-full max-w-2xl px-4 py-8 mx-auto">
        
        <div class="glass-panel rounded-3xl p-6 md:p-12 text-center transform transition-all duration-700 hover:scale-[1.01]">
            
            <!-- أيقونة القفل والحلقات -->
            <div class="relative w-32 h-32 mx-auto mb-8 flex items-center justify-center">
                <!-- الحلقة الخارجية -->
                <svg class="absolute inset-0 w-full h-full text-emerald-500/20 spin-slow" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="10 5" />
                </svg>
                <!-- الحلقة الداخلية -->
                <svg class="absolute inset-2 w-[85%] h-[85%] text-emerald-400/40 spin-slow-reverse mx-auto my-auto" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="20 10 5 10" />
                </svg>
                <!-- القفل -->
                <div class="relative z-10 bg-slate-900 border border-emerald-500/30 w-16 h-16 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(16,185,129,0.2)]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
            </div>

            <!-- العنوان وتفاصيل الحالة -->
            <div class="mb-8">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-mono mb-4">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Developer : Al-Zain
                </div>
                
                <h1 class="text-3xl md:text-5xl font-black mb-3 tracking-tight">
                    تم <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">تشفير</span> النظام
                </h1>
                
                <p class="text-slate-400 text-sm md:text-base leading-relaxed max-w-lg mx-auto">
                    الموقع يخضع حاليًا لعملية تحديث أمني وتطوير شاملة من قبل المطور. 
                    سيتم فك التشفير وإعادة تشغيل الخوادم تلقائيًا عند اكتمال العداد.
                </p>
            </div>

            <!-- شريط التقدم -->
            <div class="w-full max-w-md mx-auto mb-8">
                <div class="flex justify-between text-xs font-mono text-slate-500 mb-2 px-1" dir="ltr">
                    <span>Decryption Progress</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 w-0 transition-all duration-1000 ease-out progress-glow"></div>
                </div>
            </div>

            <!-- العداد التنازلي -->
            <div class="flex items-center justify-center gap-3 md:gap-5" dir="ltr">
                <!-- الساعات -->
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 md:w-24 md:h-24 bg-slate-900/80 backdrop-blur-sm border border-slate-700/50 rounded-2xl flex items-center justify-center shadow-lg relative overflow-hidden group">
                        <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-emerald-900/20 to-transparent"></div>
                        <span id="hours" class="text-3xl md:text-4xl font-bold text-white font-mono z-10 group-hover:scale-110 transition-transform">24</span>
                    </div>
                    <span class="text-slate-500 text-xs md:text-sm font-semibold mt-3 uppercase tracking-wider">ساعات</span>
                </div>

                <!-- فاصل -->
                <div class="text-2xl md:text-3xl font-bold text-slate-600 self-start mt-4 md:mt-6 animate-pulse">:</div>

                <!-- الدقائق -->
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 md:w-24 md:h-24 bg-slate-900/80 backdrop-blur-sm border border-slate-700/50 rounded-2xl flex items-center justify-center shadow-lg relative overflow-hidden group">
                        <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-emerald-900/20 to-transparent"></div>
                        <span id="minutes" class="text-3xl md:text-4xl font-bold text-white font-mono z-10 group-hover:scale-110 transition-transform">00</span>
                    </div>
                    <span class="text-slate-500 text-xs md:text-sm font-semibold mt-3 uppercase tracking-wider">دقائق</span>
                </div>

                <!-- فاصل -->
                <div class="text-2xl md:text-3xl font-bold text-slate-600 self-start mt-4 md:mt-6 animate-pulse">:</div>

                <!-- الثواني -->
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 md:w-24 md:h-24 bg-slate-900/80 backdrop-blur-sm border border-slate-700/50 rounded-2xl flex items-center justify-center shadow-lg relative overflow-hidden group">
                        <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-emerald-900/20 to-transparent"></div>
                        <span id="seconds" class="text-3xl md:text-4xl font-bold text-emerald-400 font-mono z-10 group-hover:scale-110 transition-transform">00</span>
                    </div>
                    <span class="text-slate-500 text-xs md:text-sm font-semibold mt-3 uppercase tracking-wider">ثواني</span>
                </div>
            </div>

            <!-- نص الـ Terminal السفلي -->
            <div class="mt-10 pt-6 border-t border-slate-800 text-left" dir="ltr">
                <p class="font-mono text-xs text-slate-500 flex items-center gap-2">
                    <span class="text-emerald-500">&gt;</span> 
                    <span>System update in progress</span>
                    <span class="cursor-blink w-1.5 h-3.5 bg-slate-400 inline-block align-middle ml-1"></span>
                </p>
            </div>

        </div>
    </div>

    <script>
        // تحديد المدة بالملي ثانية (24 ساعة)
        const duration = 24 * 60 * 60 * 1000;
        
        // إعداد وقت البداية والانتهاء باستخدام LocalStorage مع مفاتيح جديدة لضمان عملها فوراً
        let targetDate = localStorage.getItem('encryptionEndTime_v24');
        let startDate = localStorage.getItem('encryptionStartTime_v24');

        const nowTime = new Date().getTime();

        // إعادة ضبط العداد إذا لم يكن موجوداً أو إذا انتهى الوقت
        if (!targetDate || !startDate || nowTime > parseInt(targetDate)) {
            startDate = nowTime;
            targetDate = nowTime + duration;
            localStorage.setItem('encryptionStartTime_v24', startDate);
            localStorage.setItem('encryptionEndTime_v24', targetDate);
        } else {
            targetDate = parseInt(targetDate);
            startDate = parseInt(startDate);
        }

        const hoursElement = document.getElementById('hours');
        const minutesElement = document.getElementById('minutes');
        const secondsElement = document.getElementById('seconds');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // تحديث العداد وشريط التقدم كل ثانية
        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            
            // حساب نسبة التقدم
            const elapsed = now - startDate;
            let progressPercent = (elapsed / duration) * 100;
            if(progressPercent > 100) progressPercent = 100;
            if(progressPercent < 0) progressPercent = 0;

            // تحديث شريط التقدم
            progressBar.style.width = `${progressPercent}%`;
            progressText.innerText = `${progressPercent.toFixed(1)}%`;

            // إذا انتهى الوقت
            if (distance <= 0) {
                clearInterval(timerInterval);
                hoursElement.innerText = "00";
                minutesElement.innerText = "00";
                secondsElement.innerText = "00";
                
                // تغيير الواجهة لتوضيح اكتمال التحديث
                document.querySelector('h1').innerHTML = 'تم <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">تحديث</span> النظام بنجاح!';
                document.querySelector('.text-emerald-400.text-xs').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> STATUS: ONLINE_AND_READY';
                progressBar.style.width = '100%';
                progressText.innerText = '100%';
                
                localStorage.removeItem('encryptionEndTime_v24');
                localStorage.removeItem('encryptionStartTime_v24');
                return;
            }

            // حساب الساعات والدقائق والثواني
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // عرض الأرقام بتنسيق 00
            hoursElement.innerText = hours.toString().padStart(2, '0');
            minutesElement.innerText = minutes.toString().padStart(2, '0');
            secondsElement.innerText = seconds.toString().padStart(2, '0');

        }, 1000);
    </script>
</body>
</html>
