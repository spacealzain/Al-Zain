
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إيقاف الموقع | Suspended</title>
    
    <!-- الخطوط (Cairo & Manrope) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Manrope:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* -----------------------------------------------------------
           نفس متغيرات الألوان الخاصة بموقعك (Al-Zain Brand)
           ----------------------------------------------------------- */
        :root {
            /* Backgrounds - Light */
            --bg-body: #F3F5F4;          
            --bg-card-light: #FFFFFF;    
            --bg-card-accent: #E6EFEC;   
            
            /* Text Colors - Dark */
            --text-main: #111816;        
            --text-secondary: #4a5550;   
            --text-muted: #666666;

            /* Brand Colors (Green) */
            --green-brand: #1A3C34;      
            --green-bg-rich: #142E28;    
            --green-light: #2C5F52;
            --green-highlight: #4ADE80;
            
            /* UI Elements */
            --radius-xl: 32px;
            --radius-pill: 100px;
            --shadow-card: 0 10px 40px rgba(0,0,0,0.05);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* للشاشات العادية */
            min-height: 100dvh; /* لحل مشكلة شريط المتصفح في الهواتف */
            padding: 20px;
            overflow: hidden;
        }

        .en-font { 
            font-family: 'Manrope', sans-serif; 
            direction: ltr; 
            display: inline-block;
        }

        a { text-decoration: none; color: inherit; }

        /* -----------------------------------------------------------
           الكارت الرئيسي
           ----------------------------------------------------------- */
        .hero-card {
            background-color: var(--bg-card-light);
            width: 100%;
            max-width: 550px;
            border-radius: var(--radius-xl);
            padding: 50px 40px 40px;
            text-align: center;
            box-shadow: var(--shadow-card);
            border: 1px solid #fff;
            position: relative;
            animation: slideUp 0.8s cubic-bezier(0.2, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* -----------------------------------------------------------
           أيقونة القفل (نفس ستايل الأيقونات في موقعك)
           ----------------------------------------------------------- */
        .icon-container {
            width: 90px;
            height: 90px;
            background-color: #fef2f2; /* أحمر فاتح جداً */
            color: #ef4444; /* أحمر للتنبيه */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 30px;
            position: relative;
            box-shadow: 0 0 0 10px rgba(239, 68, 68, 0.05);
            animation: pulse-icon 2s infinite;
        }

        @keyframes pulse-icon {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* -----------------------------------------------------------
           النصوص
           ----------------------------------------------------------- */
        .hero-card h1 {
            font-size: 32px; 
            font-weight: 800; 
            color: var(--green-brand); 
            margin-bottom: 15px; 
            line-height: 1.3;
        }

        .hero-card p {
            font-size: 16px; 
            color: var(--text-secondary); 
            line-height: 1.7;
            margin-bottom: 35px;
        }

        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 30px 0;
        }

        /* -----------------------------------------------------------
           قسم المطور (Al-Zain) - زر تفاعلي بالكامل
           ----------------------------------------------------------- */
        .dev-action-card {
            display: flex;
            flex-direction: column;
            background-color: var(--green-brand);
            color: #fff;
            padding: 25px;
            border-radius: 24px;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(26, 60, 52, 0.15);
            position: relative;
            overflow: hidden;
            gap: 15px;
        }

        .dev-action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(26, 60, 52, 0.25);
            background-color: var(--green-light);
        }

        .dev-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .dev-text {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 700;
        }

        .dev-action-card .logo {
            font-weight: 900;
            font-size: 36px;
            color: #fff;
            letter-spacing: 1px;
            margin: 0;
        }

        .dev-click-hint {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 800;
            transition: var(--transition);
        }

        .dev-action-card:hover .dev-click-hint {
            background-color: #fff;
            color: var(--green-brand);
        }

        /* -----------------------------------------------------------
           ديكور الخلفية
           ----------------------------------------------------------- */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.1), rgba(26, 60, 52, 0.05));
            z-index: -1;
        }
        /* استخدام clamp لجعل الأشكال تتمدد وتصغر بمرونة مع حجم الشاشة */
        .shape-1 { width: clamp(250px, 40vw, 400px); height: clamp(250px, 40vw, 400px); top: -10%; right: -10%; }
        .shape-2 { width: clamp(200px, 30vw, 300px); height: clamp(200px, 30vw, 300px); bottom: -10%; left: -10%; }

        /* -----------------------------------------------------------
           التجاوب مع جميع الأجهزة (Responsive Design)
           ----------------------------------------------------------- */
        @media (max-width: 600px) {
            .hero-card { 
                padding: 40px 20px 30px; 
                border-radius: 24px; 
            }
            .icon-container { 
                width: 75px; 
                height: 75px; 
                font-size: 30px; 
                margin-bottom: 20px; 
            }
            .hero-card h1 { 
                font-size: 24px; 
                margin-bottom: 12px; 
            }
            .hero-card p { 
                font-size: 14px; 
                margin-bottom: 25px; 
            }
            hr { margin: 20px 0; }
            
            .dev-action-card { 
                padding: 20px 15px; 
                gap: 12px; 
                border-radius: 20px; 
            }
            .dev-text { font-size: 13px; }
            .dev-action-card .logo { font-size: 28px; }
            .dev-click-hint { 
                font-size: 13px; 
                padding: 12px; 
                border-radius: 14px; 
            }
        }

        @media (max-width: 360px) {
            /* تعديلات إضافية للهواتف الصغيرة جداً مثل iPhone SE */
            .hero-card h1 { font-size: 22px; }
            .dev-action-card .logo { font-size: 24px; }
            .dev-text { font-size: 12px; }
            .dev-click-hint { font-size: 12px; flex-direction: column; text-align: center; gap: 5px; }
        }
    </style>
</head>
<body>

    <!-- أشكال ديكورية في الخلفية -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="hero-card">
        
        <!-- أيقونة الإيقاف -->
        <div class="icon-container">
            <i class="fas fa-lock"></i>
        </div>

        <!-- النصوص -->
        <h1>الخدمة معلقة</h1>
        <p>
             لقد تم إيقاف هذا الموقع من قِبل الإدارة التقنية. إذا كنت صاحب الموقع وترغب في إعادة التفعيل أو الاستفسار، يرجى التواصل مع مطور النظام.
        </p>

        <hr>

        <!-- قسم المطور بهويتك البصرية (قابل للضغط بالكامل) -->
        <a href="https://www.al-zain.site" target="_blank" class="dev-action-card">
            <div class="dev-info">
                <span class="dev-text">المطور والمسؤول التقني عن الموقع</span>
                <span class="logo en-font">𝐴𝑙-𝑍𝑎𝑖𝑛</span>
            </div>
            <div class="dev-click-hint">
                <i class="fas fa-link"></i>
                <span>اضغط هنا للتواصل وإعادة التفعيل</span>
            </div>
        </a>
        
    </div>

</body>
</html>
